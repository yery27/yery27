<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b2f"/><stop offset="1" stop-color="#ff9a3d"/>
    </linearGradient>
    <style>
      text { font-family: Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .l { opacity: 0; animation: show 9s infinite; font-size: 14px; fill: #c9d1d9; }
      .l2 { animation-delay: .4s; } .l3 { animation-delay: .8s; } .l4 { animation-delay: 1.2s; } .l5 { animation-delay: 1.6s; } .l6 { animation-delay: 2s; }
      @keyframes show {
        0% { opacity: 0; transform: translateX(-12px); }
        5%, 90% { opacity: 1; transform: none; }
        98%, 100% { opacity: 0; }
      }
      .ok { fill: #4ade80; }
    </style>
  </defs>
  <rect x="1" y="1" width="998" height="188" rx="20" fill="#11141a" stroke="#fff" stroke-opacity=".1"/>
  <rect x="34" y="34" width="52" height="52" rx="14" fill="#ff3b2f" fill-opacity=".12"/>
  <g transform="translate(34 34)" fill="none" stroke="#ff5a4a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 17h9l3 4h14a3 3 0 0 1 3 3v13a3 3 0 0 1-3 3H16a3 3 0 0 1-3-3z"/>
  </g>
  <text x="34" y="122" font-size="28" font-weight="800" fill="#f5f6f8">mis-skills</text>
  <text x="34" y="148" font-size="14" fill="#8b949e">Mi colección de skills para agentes de IA:</text>
  <text x="34" y="167" font-size="14" fill="#8b949e">diseño, seguridad, testing y flujo de trabajo.</text>

  <rect x="500" y="28" width="470" height="134" rx="12" fill="#0b0d10" stroke="#fff" stroke-opacity=".08"/>
  <text class="mono l" x="522" y="55"><tspan class="ok">✓</tspan> frontend-design</text>
  <text class="mono l l2" x="522" y="80"><tspan class="ok">✓</tspan> systematic-debugging</text>
  <text class="mono l l3" x="522" y="105"><tspan class="ok">✓</tspan> test-driven-development</text>
  <text class="mono l l4" x="522" y="130"><tspan class="ok">✓</tspan> incident-response</text>
  <text class="mono l l5" x="740" y="55"><tspan class="ok">✓</tspan> threat-hunting</text>
  <text class="mono l l6" x="740" y="80"><tspan class="ok">✓</tspan> log-analysis</text>
  <text class="mono l l6" x="740" y="105" fill="#6e7681" style="fill:#6e7681"><tspan class="ok">✓</tspan> recon-osint</text>
  <text class="mono l l6" x="740" y="130" style="fill:#6e7681">+ más…</text>
</svg>
