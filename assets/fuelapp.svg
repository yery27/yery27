<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2D2D"/><stop offset="1" stop-color="#FF8A3D"/>
    </linearGradient>
    <style>
      .t { font: 14px 'Fira Code', Consolas, monospace; fill: #8b949e; }
      .h { font: 700 26px 'Segoe UI', Arial, sans-serif; fill: #fff; }
      .lbl { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #e6edf3; }
      .price { font: 700 17px 'Fira Code', Consolas, monospace; fill: #4ade80; }
      .row { opacity: 0; animation: row 9s infinite; }
      .r2 { animation-delay: .5s; } .r3 { animation-delay: 1s; } .r4 { animation-delay: 1.5s; }
      @keyframes row { 0% { opacity: 0; transform: translateX(-16px); } 6%, 90% { opacity: 1; transform: none; } 100% { opacity: 0; } }
      .bar { transform-box: fill-box; transform-origin: 0 50%; animation: grow 9s infinite; }
      @keyframes grow { 0% { transform: scaleX(0); } 12%, 90% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
      .pulse { animation: p 2s ease-in-out infinite; }
      @keyframes p { 50% { opacity: .3; } }
    </style>
  </defs>
  <rect x="2" y="2" width="896" height="296" rx="16" fill="#0D1117" stroke="url(#red)" stroke-width="2"/>
  <circle cx="34" cy="34" r="6" fill="#FF2D2D" class="pulse"/>
  <text x="52" y="40" class="t">fuelapp.es · datos oficiales MITECO · +11.000 gasolineras</text>
  <text x="34" y="86" class="h">Gasolina y diésel más baratos de España</text>

  <g class="row"><text x="34" y="140" class="lbl">Gasolina 95</text><rect x="190" y="126" width="460" height="10" rx="5" fill="#21262d"/><rect x="190" y="126" width="380" height="10" rx="5" fill="url(#red)" class="bar"/></g>
  <g class="row r2"><text x="34" y="180" class="lbl">Gasolina 98</text><rect x="190" y="166" width="460" height="10" rx="5" fill="#21262d"/><rect x="190" y="166" width="430" height="10" rx="5" fill="url(#red)" class="bar"/></g>
  <g class="row r3"><text x="34" y="220" class="lbl">Diésel</text><rect x="190" y="206" width="460" height="10" rx="5" fill="#21262d"/><rect x="190" y="206" width="350" height="10" rx="5" fill="url(#red)" class="bar"/></g>
  <g class="row r4"><text x="34" y="260" class="lbl">Diésel+</text><rect x="190" y="246" width="460" height="10" rx="5" fill="#21262d"/><rect x="190" y="246" width="395" height="10" rx="5" fill="url(#red)" class="bar"/></g>
  <text x="866" y="286" text-anchor="end" class="t" font-size="11">gráfico ilustrativo</text>
</svg>
