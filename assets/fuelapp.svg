<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b2f"/><stop offset="1" stop-color="#ff9a3d"/>
    </linearGradient>
    <clipPath id="map"><rect x="590" y="84" width="370" height="366" rx="14"/></clipPath>
    <style>
      text { font-family: Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .row { opacity: 0; animation: rin 8s infinite; }
      .d1 { animation-delay: .25s; } .d2 { animation-delay: .5s; } .d3 { animation-delay: .75s; }
      @keyframes rin {
        0% { opacity: 0; transform: translateX(-26px); }
        6%, 88% { opacity: 1; transform: none; }
        96%, 100% { opacity: 0; transform: translateX(12px); }
      }
      .ring { transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out infinite; }
      .ring2 { animation-delay: 1.2s; }
      @keyframes ring { 0% { transform: scale(.25); opacity: .85; } 100% { transform: scale(1); opacity: 0; } }
      .route { stroke-dasharray: 7 9; animation: dash 1s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -16; } }
      .badge { animation: glow 2s ease-in-out infinite; }
      @keyframes glow { 50% { opacity: .55; } }
      .tag { transform-box: fill-box; transform-origin: center bottom; animation: bob 3s ease-in-out infinite; }
      @keyframes bob { 50% { transform: translateY(-5px); } }
    </style>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="998" height="488" rx="20" fill="#0b0d10" stroke="#fff" stroke-opacity=".1"/>
  <rect x="1" y="1" width="998" height="58" rx="20" fill="#11141a"/>
  <rect x="1" y="40" width="998" height="19" fill="#11141a"/>
  <line x1="1" y1="59" x2="999" y2="59" stroke="#fff" stroke-opacity=".08"/>
  <circle cx="30" cy="30" r="6.5" fill="#ff5f56"/><circle cx="52" cy="30" r="6.5" fill="#ffbd2e"/><circle cx="74" cy="30" r="6.5" fill="#27c93f"/>
  <rect x="300" y="14" width="400" height="32" rx="16" fill="#0b0d10" stroke="#fff" stroke-opacity=".08"/>
  <rect x="320" y="26" width="9" height="8" rx="1.5" fill="#4ade80"/>
  <path d="M322 26v-3a2.5 2.5 0 0 1 5 0v3" fill="none" stroke="#4ade80" stroke-width="1.5"/>
  <text class="mono" x="500" y="35" font-size="14" fill="#c9d1d9" text-anchor="middle">fuelapp.es</text>

  <!-- left panel -->
  <text class="mono" x="40" y="96" font-size="12" letter-spacing="2" fill="#ff5a4a">PRECIO DE GASOLINERAS HOY</text>
  <text x="40" y="132" font-size="30" font-weight="800" fill="#f5f6f8" letter-spacing="-.5">Las más baratas de España</text>

  <rect x="40" y="152" width="82" height="30" rx="15" fill="none" stroke="#fff" stroke-opacity=".15"/>
  <text x="81" y="172" font-size="13" fill="#aab2bd" text-anchor="middle">Gasolina</text>
  <rect x="130" y="152" width="72" height="30" rx="15" fill="url(#red)"/>
  <text x="166" y="172" font-size="13" font-weight="700" fill="#0b0d10" text-anchor="middle">Diésel</text>
  <rect x="210" y="152" width="64" height="30" rx="15" fill="none" stroke="#fff" stroke-opacity=".15"/>
  <text x="242" y="172" font-size="13" fill="#aab2bd" text-anchor="middle">Gas GLP</text>

  <g class="row">
    <rect x="40" y="200" width="520" height="58" rx="14" fill="#161a21" stroke="#ff3b2f" stroke-opacity=".6"/>
    <circle cx="70" cy="229" r="14" fill="url(#red)"/><text x="70" y="234" font-size="14" font-weight="800" fill="#0b0d10" text-anchor="middle">1</text>
    <text x="98" y="224" font-size="16" font-weight="700" fill="#f5f6f8">Petroprix · Girona</text>
    <rect x="98" y="233" width="86" height="16" rx="8" fill="#4ade80" fill-opacity=".16" class="badge"/>
    <text class="mono" x="141" y="245" font-size="10" font-weight="700" fill="#4ade80" text-anchor="middle">MÁS BARATA</text>
    <text class="mono" x="540" y="236" font-size="22" font-weight="700" fill="#4ade80" text-anchor="end">1,399 €</text>
  </g>
  <g class="row d1">
    <rect x="40" y="266" width="520" height="58" rx="14" fill="#11141a" stroke="#fff" stroke-opacity=".08"/>
    <circle cx="70" cy="295" r="14" fill="#1f252d"/><text x="70" y="300" font-size="14" font-weight="700" fill="#aab2bd" text-anchor="middle">2</text>
    <text x="98" y="291" font-size="16" font-weight="600" fill="#e6edf3">Plenergy · Lleida</text>
    <text x="98" y="310" font-size="12" fill="#6e7681">a 14 km</text>
    <text class="mono" x="540" y="302" font-size="20" font-weight="700" fill="#e6edf3" text-anchor="end">1,412 €</text>
  </g>
  <g class="row d2">
    <rect x="40" y="332" width="520" height="58" rx="14" fill="#11141a" stroke="#fff" stroke-opacity=".08"/>
    <circle cx="70" cy="361" r="14" fill="#1f252d"/><text x="70" y="366" font-size="14" font-weight="700" fill="#aab2bd" text-anchor="middle">3</text>
    <text x="98" y="357" font-size="16" font-weight="600" fill="#e6edf3">Ballenoil · Tarragona</text>
    <text x="98" y="376" font-size="12" fill="#6e7681">a 31 km</text>
    <text class="mono" x="540" y="368" font-size="20" font-weight="700" fill="#e6edf3" text-anchor="end">1,419 €</text>
  </g>
  <g class="row d3">
    <rect x="40" y="398" width="520" height="52" rx="14" fill="#11141a" stroke="#fff" stroke-opacity=".08"/>
    <circle cx="70" cy="424" r="14" fill="#1f252d"/><text x="70" y="429" font-size="14" font-weight="700" fill="#aab2bd" text-anchor="middle">4</text>
    <text x="98" y="429" font-size="16" font-weight="600" fill="#e6edf3">Bonàrea · Barcelona</text>
    <text class="mono" x="540" y="431" font-size="20" font-weight="700" fill="#e6edf3" text-anchor="end">1,427 €</text>
  </g>
  <text class="mono" x="40" y="474" font-size="11" fill="#6e7681">datos oficiales MITECO · +11.000 gasolineras</text>
  <text class="mono" x="960" y="474" font-size="11" fill="#6e7681" text-anchor="end">maqueta con datos de ejemplo</text>

  <!-- map -->
  <rect x="590" y="84" width="370" height="366" rx="14" fill="#0e1116" stroke="#fff" stroke-opacity=".08"/>
  <g clip-path="url(#map)" fill="none" stroke-linecap="round">
    <path d="M590 340 C650 330 700 360 760 330 S880 300 960 330 V450 H590Z" fill="#12202b" stroke="none"/>
    <g stroke="#1d232c" stroke-width="10">
      <path d="M590 190 L960 150"/><path d="M640 84 L720 450"/><path d="M800 84 L850 450"/><path d="M590 270 L960 250"/>
    </g>
    <g stroke="#262d37" stroke-width="3">
      <path d="M590 190 L960 150"/><path d="M640 84 L720 450"/><path d="M800 84 L850 450"/><path d="M590 270 L960 250"/>
    </g>
    <g stroke="#171c23" stroke-width="2">
      <path d="M590 130 L960 105"/><path d="M590 230 L960 205"/><path d="M590 400 L960 380"/><path d="M700 84 L760 450"/><path d="M910 84 L940 450"/>
    </g>
    <path class="route" d="M690 385 C700 300 780 270 800 220 S850 180 878 150" stroke="#ff5a4a" stroke-width="3.5"/>
  </g>
  <!-- you -->
  <circle cx="690" cy="385" r="7" fill="#38bdf8" stroke="#0b0d10" stroke-width="3"/>
  <circle class="ring ring2" cx="690" cy="385" r="22" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <!-- pins -->
  <circle cx="760" cy="300" r="6" fill="#aab2bd"/><circle cx="905" cy="270" r="6" fill="#aab2bd"/><circle cx="650" cy="150" r="6" fill="#aab2bd"/>
  <circle class="ring" cx="878" cy="150" r="30" fill="none" stroke="#ff3b2f" stroke-width="2.5"/>
  <circle cx="878" cy="150" r="9" fill="url(#red)" stroke="#0b0d10" stroke-width="3"/>
  <g class="tag">
    <rect x="838" y="104" width="80" height="28" rx="14" fill="#4ade80"/>
    <path d="M870 131 l8 8 l8 -8z" fill="#4ade80"/>
    <text class="mono" x="878" y="123" font-size="14" font-weight="800" fill="#0b0d10" text-anchor="middle">1,399 €</text>
  </g>
  <rect x="606" y="100" width="108" height="26" rx="13" fill="#0b0d10" fill-opacity=".85" stroke="#fff" stroke-opacity=".12"/>
  <circle cx="622" cy="113" r="4" fill="#38bdf8"/><text class="mono" x="632" y="117" font-size="11" fill="#c9d1d9">cerca de ti</text>
</svg>
