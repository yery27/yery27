<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3b2f"/><stop offset="1" stop-color="#ff9a3d"/>
    </linearGradient>
    <style>
      text { font-family: Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; }
      .card { animation: float 4s ease-in-out infinite; }
      .c2 { animation-delay: .5s; } .c3 { animation-delay: 1s; } .c4 { animation-delay: 1.5s; }
      @keyframes float { 50% { transform: translateY(-5px); } }
      .t { font-size: 17px; font-weight: 700; fill: #f5f6f8; }
      .d { font-size: 12.5px; fill: #8b949e; }
      .ic { fill: none; stroke: #ff5a4a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <g class="card">
    <rect x="1" y="1" width="232" height="140" rx="16" fill="#11141a" stroke="#fff" stroke-opacity=".08"/>
    <rect x="20" y="20" width="44" height="44" rx="12" fill="#ff3b2f" fill-opacity=".12"/>
    <g transform="translate(20 20)" class="ic"><path d="M22 9c-5 0-9 4-9 9 0 7 9 17 9 17s9-10 9-17c0-5-4-9-9-9z"/><circle cx="22" cy="18" r="3.5"/></g>
    <text class="t" x="20" y="92">Gasolineras</text>
    <text class="d" x="20" y="112">Precios oficiales del MITECO</text>
    <text class="d" x="20" y="128">por provincia y en mapa</text>
  </g>
  <g class="card c2">
    <rect x="257" y="1" width="232" height="140" rx="16" fill="#11141a" stroke="#fff" stroke-opacity=".08"/>
    <rect x="276" y="20" width="44" height="44" rx="12" fill="#ff3b2f" fill-opacity=".12"/>
    <g transform="translate(276 20)" class="ic"><path d="M22 9s-9 10-9 17a9 9 0 0 0 18 0c0-7-9-17-9-17z"/><path d="M18 27a4 4 0 0 0 4 4"/></g>
    <text class="t" x="276" y="92">Repostajes</text>
    <text class="d" x="276" y="112">Consumo, coste por km y</text>
    <text class="d" x="276" y="128">gastos de cada coche</text>
  </g>
  <g class="card c3">
    <rect x="513" y="1" width="232" height="140" rx="16" fill="#11141a" stroke="#fff" stroke-opacity=".08"/>
    <rect x="532" y="20" width="44" height="44" rx="12" fill="#ff3b2f" fill-opacity=".12"/>
    <g transform="translate(532 20)" class="ic"><path d="M9 28l3-8a3 3 0 0 1 3-2h14a3 3 0 0 1 3 2l3 8v6h-4v-2H13v2H9z"/><circle cx="15" cy="27" r="1.2"/><circle cx="29" cy="27" r="1.2"/></g>
    <text class="t" x="532" y="92">Garaje</text>
    <text class="d" x="532" y="112">Varios coches con catálogo</text>
    <text class="d" x="532" y="128">de marcas, modelos y motores</text>
  </g>
  <g class="card c4">
    <rect x="767" y="1" width="232" height="140" rx="16" fill="#11141a" stroke="#fff" stroke-opacity=".08"/>
    <rect x="786" y="20" width="44" height="44" rx="12" fill="#ff3b2f" fill-opacity=".12"/>
    <g transform="translate(786 20)" class="ic"><path d="M22 9l11 4v8c0 7-5 12-11 15-6-3-11-8-11-15v-8z"/><path d="M17 22l4 4 6-7"/></g>
    <text class="t" x="786" y="92">Privacidad</text>
    <text class="d" x="786" y="112">Datos aislados por cuenta;</text>
    <text class="d" x="786" y="128">lo público lo eliges tú</text>
  </g>
</svg>
