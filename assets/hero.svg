<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#1a0b0d"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2D2D"/><stop offset="1" stop-color="#FF8A3D"/>
    </linearGradient>
    <style>
      .name { font: 800 78px 'Segoe UI', Arial, sans-serif; fill: url(#red); }
      .sub { font: 500 20px 'Fira Code', Consolas, monospace; fill: #c9d1d9; }
      .dash { stroke: #FF2D2D; stroke-width: 4; stroke-dasharray: 36 28; animation: road 1.2s linear infinite; }
      @keyframes road { to { stroke-dashoffset: -64; } }
      .in { opacity: 0; animation: in 1s .2s ease-out forwards; }
      .in2 { opacity: 0; animation: in 1s .6s ease-out forwards; }
      @keyframes in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      .blink { animation: b 1s steps(2) infinite; }
      @keyframes b { 50% { opacity: 0; } }
      .glow { animation: g 3s ease-in-out infinite; }
      @keyframes g { 50% { opacity: .35; } }
    </style>
  </defs>
  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <rect x="2" y="2" width="896" height="256" rx="17" fill="none" stroke="url(#red)" stroke-width="2" class="glow"/>
  <text x="450" y="120" text-anchor="middle" class="name in">Yery27</text>
  <text x="450" y="160" text-anchor="middle" class="sub in2">Desarrollo web · Ciberseguridad · Servidores<tspan class="blink" fill="#FF2D2D"> ▍</tspan></text>
  <line x1="40" y1="215" x2="860" y2="215" class="dash"/>
  <line x1="40" y1="236" x2="860" y2="236" stroke="#30363d" stroke-width="2"/>
</svg>
