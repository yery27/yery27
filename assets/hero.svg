<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9f1c"/><stop offset="0.55" stop-color="#ff5a3c"/><stop offset="1" stop-color="#e5252a"/>
    </linearGradient>
    <radialGradient id="glow" cx="790" cy="170" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e5252a" stop-opacity=".30"/><stop offset="1" stop-color="#e5252a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="c"><rect width="1000" height="340" rx="22"/></clipPath>
    <style>
      text { font-family: 'Bricolage Grotesque', 'Geist', 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .name { font-size: 104px; font-weight: 800; letter-spacing: -3px; fill: #ecf0ea; }
      .role { font-size: 26px; font-weight: 500; fill: #9aa49d; opacity: 0; animation: role 9s infinite; }
      .r2 { animation-delay: 3s; } .r3 { animation-delay: 6s; }
      @keyframes role {
        0% { opacity: 0; transform: translateY(12px); }
        4%, 30% { opacity: 1; transform: none; }
        34%, 100% { opacity: 0; transform: translateY(-12px); }
      }
      .cur { animation: blink 1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .road { stroke: #ff5a3c; stroke-width: 3; stroke-dasharray: 30 24; animation: road 1s linear infinite; opacity: .55; }
      @keyframes road { to { stroke-dashoffset: -54; } }
      .prog { animation: prog 7s cubic-bezier(.6,0,.25,1) infinite; }
      @keyframes prog {
        0% { stroke-dasharray: 1 100; } 45% { stroke-dasharray: 87 100; }
        55% { stroke-dasharray: 82 100; } 62% { stroke-dasharray: 86 100; }
        100% { stroke-dasharray: 1 100; }
      }
      .needle { transform-origin: 790px 170px; animation: needle 7s cubic-bezier(.6,0,.25,1) infinite; }
      @keyframes needle {
        0% { transform: rotate(-134deg); } 45% { transform: rotate(100deg); }
        55% { transform: rotate(82deg); } 62% { transform: rotate(96deg); }
        100% { transform: rotate(-134deg); }
      }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .25; } }
    </style>
  </defs>

  <g clip-path="url(#c)">
    <rect width="1000" height="340" fill="#0a0d0b"/>
    <rect width="1000" height="340" fill="url(#grid)"/>
    <rect width="1000" height="340" fill="url(#glow)"/>

    <!-- gauge -->
    <path d="M 695.25 264.75 A 134 134 0 1 1 884.75 264.75" pathLength="100" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="9" stroke-dasharray="0.45 2.3278"/>
    <path d="M 710.8 249.2 A 112 112 0 1 1 869.2 249.2" pathLength="100" fill="none" stroke="#1a201b" stroke-width="16" stroke-linecap="round"/>
    <path class="prog" d="M 710.8 249.2 A 112 112 0 1 1 869.2 249.2" pathLength="100" fill="none" stroke="url(#red)" stroke-width="16" stroke-linecap="round"/>
    <text class="mono" x="700" y="296" font-size="15" fill="#9aa49d" text-anchor="middle">E</text>
    <text class="mono" x="880" y="296" font-size="15" fill="#9aa49d" text-anchor="middle">F</text>
    <g fill="none" stroke="#ff6b3d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="781" y="198" width="14" height="22" rx="3"/>
      <path d="M784 203h8M795 204h3a3 3 0 0 1 3 3v8a2 2 0 0 0 4 0v-10l-4-4"/>
    </g>
    <g class="needle">
      <polygon points="786.5,170 793.5,170 790,86" fill="#ff5a3c"/>
      <circle cx="790" cy="170" r="11" fill="#0a0d0b" stroke="#ff5a3c" stroke-width="3"/>
    </g>

    <!-- text -->
    <text class="mono" x="58" y="82" font-size="15" fill="#ff6b3d">~/yery27 <tspan fill="#6e7681">— catalunya</tspan><tspan class="cur" fill="#ff6b3d"> ▍</tspan></text>
    <text class="name" x="52" y="176">Yery<tspan fill="url(#red)">27</tspan></text>
    <text class="role" x="58" y="222">Desarrollo web</text>
    <text class="role r2" x="58" y="222">Ciberseguridad</text>
    <text class="role r3" x="58" y="222">Servidores y redes</text>

    <rect x="58" y="248" width="150" height="38" rx="19" fill="url(#red)"/>
    <text class="mono" x="133" y="272" font-size="15" font-weight="700" fill="#0a0d0b" text-anchor="middle">fuelapp.es ↗</text>
    <rect x="222" y="248.5" width="150" height="37" rx="18.5" fill="none" stroke="#fff" stroke-opacity=".18"/>
    <circle cx="246" cy="267" r="4" fill="#4ade80" class="pulse"/>
    <text class="mono" x="262" y="272" font-size="14" fill="#d4dbd5">online</text>

    <line x1="40" y1="316" x2="960" y2="316" class="road"/>
  </g>
  <rect x=".75" y=".75" width="998.5" height="338.5" rx="21.5" fill="none" stroke="#fff" stroke-opacity=".1"/>
</svg>
