<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36BCF7"/>
      <stop offset="0.5" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <style>
      .t { font: 15px 'Fira Code', Consolas, monospace; fill: #c9d1d9; }
      .p { fill: #36BCF7; }
      .ok { fill: #4ade80; }
      .d { fill: #6e7681; }
      .l { opacity: 0; animation: show 10s infinite; }
      @keyframes show { 0% { opacity: 0; transform: translateX(-8px); } 5%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
      .chip { opacity: 0; animation: pop 10s infinite; }
      @keyframes pop { 0% { opacity: 0; transform: scale(.6); } 4%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
      .chip rect { fill: #161b22; stroke: url(#g); stroke-width: 1.5; }
      .chip text { font: 13px 'Fira Code', Consolas, monospace; fill: #e6edf3; }
      .glow { animation: pulse 3s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .45; } }
    </style>
  </defs>
  <rect x="4" y="4" width="792" height="412" rx="14" fill="none" stroke="url(#g)" stroke-width="3" class="glow"/>
  <rect x="8" y="8" width="784" height="404" rx="12" fill="#0D1117"/>
  <circle cx="30" cy="30" r="6" fill="#ff5f56"/><circle cx="52" cy="30" r="6" fill="#ffbd2e"/><circle cx="74" cy="30" r="6" fill="#27c93f"/>
  <text x="400" y="35" text-anchor="middle" class="t d" style="font-size:12px">claude code — mis-skills</text>

  <text x="30" y="80" class="t l" style="animation-delay:.3s"><tspan class="p">❯</tspan> /plugin marketplace add yery27/mis-skills</text>
  <text x="30" y="108" class="t l" style="animation-delay:1.3s"><tspan class="ok">✔</tspan> marketplace añadido</text>
  <text x="30" y="143" class="t l" style="animation-delay:2.3s"><tspan class="p">❯</tspan> /plugin install mis-skills@mis-skills</text>
  <text x="30" y="171" class="t l" style="animation-delay:3.3s"><tspan class="ok">✔</tspan> 45 skills instaladas</text>

  <g transform="translate(30 200)">
    <g class="chip" style="animation-delay:4s"><rect x="0" y="0" width="150" height="30" rx="15"/><text x="75" y="20" text-anchor="middle">🎨 frontend-design</text></g>
    <g class="chip" style="animation-delay:4.3s"><rect x="162" y="0" width="130" height="30" rx="15"/><text x="227" y="20" text-anchor="middle">🛡️ blue-team</text></g>
    <g class="chip" style="animation-delay:4.6s"><rect x="304" y="0" width="140" height="30" rx="15"/><text x="374" y="20" text-anchor="middle">🧪 e2e-testing</text></g>
    <g class="chip" style="animation-delay:4.9s"><rect x="456" y="0" width="130" height="30" rx="15"/><text x="521" y="20" text-anchor="middle">✍️ humanizer</text></g>
    <g class="chip" style="animation-delay:5.2s"><rect x="598" y="0" width="130" height="30" rx="15"/><text x="663" y="20" text-anchor="middle">🐴 ponytail</text></g>
    <g class="chip" style="animation-delay:5.5s"><rect x="0" y="42" width="140" height="30" rx="15"/><text x="70" y="62" text-anchor="middle">🔎 log-analysis</text></g>
    <g class="chip" style="animation-delay:5.8s"><rect x="152" y="42" width="160" height="30" rx="15"/><text x="232" y="62" text-anchor="middle">🚨 incident-response</text></g>
    <g class="chip" style="animation-delay:6.1s"><rect x="324" y="42" width="140" height="30" rx="15"/><text x="394" y="62" text-anchor="middle">🎯 design-review</text></g>
    <g class="chip" style="animation-delay:6.4s"><rect x="476" y="42" width="130" height="30" rx="15"/><text x="541" y="62" text-anchor="middle">🗂️ mcp-builder</text></g>
    <g class="chip" style="animation-delay:6.7s"><rect x="618" y="42" width="110" height="30" rx="15"/><text x="673" y="62" text-anchor="middle">+ 36 más</text></g>
  </g>

  <text x="30" y="340" class="t l" style="animation-delay:7.2s"><tspan class="p">❯</tspan> "revisa el diseño de esta página"</text>
  <text x="30" y="368" class="t l" style="animation-delay:8s"><tspan class="ok">✔</tspan> mis-skills:design-review activada <tspan class="d">(sola, sin llamarla)</tspan></text>
</svg>
