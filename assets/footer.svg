<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="130" viewBox="0 0 1000 130">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9f1c"/><stop offset="0.55" stop-color="#ff5a3c"/><stop offset="1" stop-color="#e5252a"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity=".55"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="1000" height="130" rx="20"/></clipPath>
    <style>
      text { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
      .road { stroke: #fff; stroke-opacity: .35; stroke-width: 3; stroke-dasharray: 26 22; animation: road .5s linear infinite; }
      @keyframes road { to { stroke-dashoffset: -48; } }
      .car { animation: drive 9s linear infinite; }
      @keyframes drive { from { transform: translateX(-140px); } to { transform: translateX(1060px); } }
      .wheel { transform-box: fill-box; transform-origin: center; animation: spin .5s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .bounce { animation: bump .35s ease-in-out infinite; }
      @keyframes bump { 50% { transform: translateY(-1.2px); } }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1000" height="130" fill="#0a0d0b"/>
    <text x="500" y="44" font-size="15" fill="#9aa49d" text-anchor="middle">gracias por pasarte · <tspan fill="#ff6b3d">fuelapp.es</tspan></text>
    <rect y="86" width="1000" height="44" fill="#131814"/>
    <line x1="0" y1="86" x2="1000" y2="86" stroke="#fff" stroke-opacity=".12"/>
    <line x1="0" y1="112" x2="1000" y2="112" class="road"/>
    <g class="car">
      <g transform="translate(0 52)" class="bounce">
        <polygon points="86,22 240,6 240,42 86,36" fill="url(#beam)"/>
        <path d="M0 30 L6 18 Q8 14 14 14 H30 L40 4 Q42 2 46 2 H62 Q66 2 68 4 L78 14 H84 Q90 14 90 20 V32 Q90 34 88 34 H0z" fill="url(#red)"/>
        <path d="M34 14 L42 6 H60 L68 14z" fill="#0a0d0b" fill-opacity=".65"/>
        <rect x="84" y="20" width="6" height="5" rx="2" fill="#ffe9a8"/>
        <g class="wheel"><circle cx="20" cy="34" r="9" fill="#0a0d0b" stroke="#d0d7de" stroke-width="3"/><path d="M20 28v12M14 34h12" stroke="#d0d7de" stroke-width="1.5"/></g>
        <g class="wheel"><circle cx="70" cy="34" r="9" fill="#0a0d0b" stroke="#d0d7de" stroke-width="3"/><path d="M70 28v12M64 34h12" stroke="#d0d7de" stroke-width="1.5"/></g>
      </g>
    </g>
  </g>
  <rect x=".75" y=".75" width="998.5" height="128.5" rx="19.5" fill="none" stroke="#fff" stroke-opacity=".1"/>
</svg>
