<svg xmlns="http://www.w3.org/2000/svg" width="800" height="230" viewBox="0 0 800 230">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36BCF7"/>
      <stop offset="0.5" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <style>
      .t { font: 16px 'Fira Code', Consolas, monospace; fill: #c9d1d9; }
      .p { fill: #36BCF7; }
      .ok { fill: #4ade80; }
      .l { opacity: 0; }
      .l1 { animation: show 12s infinite 0.3s; }
      .l2 { animation: show 12s infinite 1.8s; }
      .l3 { animation: show 12s infinite 3.3s; }
      .l4 { animation: show 12s infinite 4.8s; }
      .l5 { animation: show 12s infinite 6.3s; }
      @keyframes show { 0% { opacity: 0; transform: translateX(-8px); } 4%, 90% { opacity: 1; transform: none; } 100% { opacity: 0; } }
      .cur { animation: blink 1s steps(1) infinite; fill: #36BCF7; }
      @keyframes blink { 50% { opacity: 0; } }
      .glow { animation: pulse 3s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: 0.45; } }
    </style>
  </defs>
  <rect x="4" y="4" width="792" height="222" rx="14" fill="none" stroke="url(#g)" stroke-width="3" class="glow"/>
  <rect x="8" y="8" width="784" height="214" rx="12" fill="#0D1117"/>
  <circle cx="30" cy="30" r="6" fill="#ff5f56"/><circle cx="52" cy="30" r="6" fill="#ffbd2e"/><circle cx="74" cy="30" r="6" fill="#27c93f"/>
  <text x="400" y="35" text-anchor="middle" class="t" style="font-size:12px;fill:#6e7681">yery27 — vibecoding.sh</text>
  <g class="t">
    <text x="30" y="75"  class="l l1"><tspan class="p">❯</tspan> claude "hazme una web guapa"</text>
    <text x="30" y="103" class="l l2"><tspan class="ok">✔</tspan> pensando en vibes…</text>
    <text x="30" y="131" class="l l3"><tspan class="ok">✔</tspan> escribiendo código (no lo leo, pero mola)</text>
    <text x="30" y="159" class="l l4"><tspan class="ok">✔</tspan> npm run dev → funciona a la primera 🙏</text>
    <text x="30" y="187" class="l l5"><tspan class="p">❯</tspan> ship it 🚀</text>
    <rect x="30" y="196" width="10" height="3" class="cur"/>
  </g>
</svg>
